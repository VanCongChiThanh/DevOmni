[workspace]
resolver = "2"
members = ["src-tauri", "crates/devomni-core"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Release profile tuned for small binary + fast diffing.
[profile.release]
# Small binary by default; the hot code (diff engine) is optimized for speed below.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep the diff engine fast even in `tauri dev`.
[profile.dev.package.devomni-core]
opt-level = 2
[profile.dev.package.similar]
opt-level = 3

[profile.release.package.devomni-core]
opt-level = 3
[profile.release.package.similar]
opt-level = 3
